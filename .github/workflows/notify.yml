name: Daily notifications

on:
  schedule:
    # 8:00, 15:00 and 20:00 in Romania. Each time appears twice (summer UTC+3 / winter UTC+2);
    # the script sends only for the one that matches local time. GitHub may start a few minutes late.
    - cron: "55 4,5,11,12,16,17 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which summary to send now"
        type: choice
        options: [morning, afternoon, evening]
        default: morning

permissions:
  contents: write

concurrency: notify

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/notify.mjs
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          MANUAL_SLOT: ${{ github.event.inputs.slot }}
      # GitHub pauses scheduled workflows in repos with no commits for 60 days.
      # This makes a tiny commit every ~45 quiet days so the notifications keep running.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +%FT%TZ > .github/keepalive
            git config user.name "remindery-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "Keep daily notifications schedule active"
            git push
          fi
