function settings(){var data=esc(JSON.stringify(S));$('sheetRoot').innerHTML='<div class="sheet"><div class="in"><div class="sheetTop"><h2>Settings</h2><button class="close" data-a="close">✕</button></div><div class="formCard"><span class="lab">Theme</span><div class="seg4"><button data-theme="auto" class="'+(S.settings.theme==='auto'?'on':'')+'">Auto</button><button data-theme="dark" class="'+(S.settings.theme==='dark'?'on':'')+'">Dark</button><button data-theme="light" class="'+(S.settings.theme==='light'?'on':'')+'">Light</button><span></span></div><span class="lab">Daily summary</span><div id="notifBox"></div><span class="lab">Backup</span><textarea id="backup" style="height:180px;font:12px monospace">'+data+'</textarea><div class="saveRow"><button class="primaryBtn" data-a="import">Import</button><button class="ghostBtn" data-a="copy">Copy</button></div><div class="note"><b>Storage:</b> reminders are saved on this device. Copy your backup before switching websites or devices. Use Calendar export for Apple Calendar alerts.</div><div class="note" style="text-align:center">Remindery '+APP_VERSION+'</div></div></div></div>';renderNotif()}
/* ---------- notifications ---------- */
function standalone(){return (navigator.standalone===true)||matchMedia('(display-mode: standalone)').matches}
function b64ToBytes(b){var p='='.repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/')),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
var subJSON='';
function renderNotif(){var box=$('notifBox');if(!box)return;
  var times='<div class="times"><span>08:00<small>For today</small></span><span>15:00<small>Left</small></span><span>20:00<small>Left</small></span></div>';
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){box.innerHTML='<div class="note">'+(standalone()?'This iPhone does not support web notifications. Update to iOS 16.4 or newer.':'<b>Open Remindery from its Home Screen icon</b> to turn on notifications. In Safari: Share → Add to Home Screen.')+'</div>'+times;return}
  if(Notification.permission==='denied'){box.innerHTML='<div class="note"><b>Notifications are blocked.</b> Turn them on in iPhone Settings → Notifications → Remindery.</div>'+times;return}
  navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription()}).then(function(sub){
    if(!sub||Notification.permission!=='granted'){box.innerHTML='<div class="notifRow"><div class="state">Off<small>Get a count of your tasks three times a day.</small></div></div>'+times+'<div class="saveRow"><button class="primaryBtn" data-a="notifOn">Turn on notifications</button></div>';return}
    subJSON=JSON.stringify(sub);
    box.innerHTML='<div class="notifRow"><div class="state" style="color:var(--ok)">On<small>Summaries arrive a few minutes after each time.</small></div></div>'+times
      +'<div class="saveRow"><button class="ghostBtn" style="flex:1" data-a="notifTest">Test now</button><button class="primaryBtn" data-a="notifCopy">Copy setup code</button></div>'
      +'<ol class="steps"><li>Tap <b>Copy setup code</b>.</li><li>On GitHub open the <b>nudge</b> repo → Settings → Secrets and variables → Actions.</li><li>Create a secret named <code class="k">PUSH_SUBSCRIPTION</code> and paste the code. Do it again if you reinstall the app.</li></ol>'}).catch(function(){box.innerHTML='<div class="note">Notifications are not available right now. Reopen the app and try again.</div>'+times})}
function notifOn(){Notification.requestPermission().then(function(p){if(p!=='granted'){renderNotif();return}
  return navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(VAPID_PUBLIC)})}).then(function(){mirror();renderNotif();toast('Notifications on · copy the setup code')})}).catch(function(){toast('Could not turn on notifications');renderNotif()})}
function notifTest(){mirror();navigator.serviceWorker.ready.then(function(reg){var sw=reg.active||navigator.serviceWorker.controller;if(sw)sw.postMessage({type:'test',slot:new Date().getHours()<12?'morning':'afternoon'});toast('Test sent · check your notifications')})}
function notifCopy(){var done=function(){toast('Setup code copied')};if(navigator.clipboard)navigator.clipboard.writeText(subJSON).then(done).catch(function(){var t=$('backup');if(t){t.value=subJSON;t.select();toast('Selected · copy it manually')}});}
function setTheme(t){S.settings.theme=t;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);save();settings()}
function applyTheme(){var t=S.settings&&S.settings.theme||'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
function preset(k){var d=$('ed'),tm=$('etm');if(k==='today')d.value=today();if(k==='tomorrow')d.value=addDays(today(),1);if(k==='tonight'){d.value=today();tm.value='20:00'}if(k==='nodate'){d.value='';tm.value=''}}
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function exportCalendar(){var title=$('et').value.trim()||'Nudge',notes=$('en').value.trim(),date=$('ed').value,time=$('etm').value,isRoutine=editorKind==='routine';if(!date){toast('Pick a date first');return}var dt=date.replace(/-/g,''),start=time?dt+'T'+time.replace(':','')+'00':dt,s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Nudge//EN\r\nBEGIN:VEVENT\r\nUID:'+uid()+'@nudge\r\nDTSTAMP:'+new Date().toISOString().replace(/[-:]|\.\d+/g,'')+'\r\n';if(time){s+='DTSTART:'+start+'\r\n';var end=new Date(date+'T'+time+':00');end=new Date(end.getTime()+30*60000);s+='DTEND:'+dateStr(end).replace(/-/g,'')+'T'+pad(end.getHours())+pad(end.getMinutes())+'00\r\n'}else{s+='DTSTART;VALUE=DATE:'+dt+'\r\nDTEND;VALUE=DATE:'+addDays(date,1).replace(/-/g,'')+'\r\n'}s+='SUMMARY:'+icsEscape(title)+'\r\n';if(notes)s+='DESCRIPTION:'+icsEscape(notes)+'\r\n';if(isRoutine){var type=$('ert').value,e=$('every')?Math.max(1,+$('every').value||1):1,rule='';if(type==='daily'||type==='intervalDays')rule='FREQ=DAILY;INTERVAL='+e;if(type==='weekly')rule='FREQ=WEEKLY;INTERVAL='+e;if(type==='monthly')rule='FREQ=MONTHLY;INTERVAL='+e;if(type==='weekdays'){var map=['SU','MO','TU','WE','TH','FR','SA'];rule='FREQ=WEEKLY;INTERVAL='+e+';BYDAY='+editorDays.slice().sort().map(function(d){return map[d]}).join(',')}if(rule)s+='RRULE:'+rule+'\r\n'}s+='BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:'+icsEscape(title)+'\r\nTRIGGER:'+(time?'PT0S':'PT9H')+'\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n';var fl=new File([s],(title.replace(/\W+/g,'_')||'nudge')+'.ics',{type:'text/calendar'});try{if(navigator.canShare&&navigator.canShare({files:[fl]})){navigator.share({files:[fl]}).catch(function(){});return}}catch(e){}var a=document.createElement('a');a.href=URL.createObjectURL(fl);a.download=fl.name;document.body.appendChild(a);a.click();var u=a.href;a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
applyTheme();render();fadeIn();mirror();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){r.update()}).catch(function(){});
['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()},{passive:false})});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
var bootDay=today();document.addEventListener('visibilitychange',function(){if(document.hidden||document.querySelector('#sheetRoot .sheet'))return;var t=today();if(t!==bootDay){if(selected===bootDay)selected=t;bootDay=t}render()});
document.addEventListener('change',function(e){if(e.target.id==='ert')renderRepeatExtra({type:e.target.value,every:1,days:editorDays})});
document.addEventListener('click',function(e){var b=e.target.closest('button');if(b){var D=b.dataset;if(D.v){var nv=D.v;if(nv===view&&!(nv==='today'&&selected!==today()))return;nav(function(){view=nv;if(view==='today')selected=today();render()},'up');return}if(D.day){var nd=D.day;if(nd===selected&&view==='today')return;nav(function(){selected=nd;view='today';render()},'up');return}if(D.check){toggleDone(D.check,D.date);return}if(D.kind){editorKind=D.kind;renderEditor(editId?S.items.find(function(x){return x.id===editId}):null);return}if(D.pr!==undefined){editorPriority=+D.pr;document.querySelectorAll('[data-pr]').forEach(function(x){x.classList.toggle('on',+x.dataset.pr===editorPriority)});return}if(D.wd!==undefined){var d=+D.wd,k=editorDays.indexOf(d);if(k>-1)editorDays.splice(k,1);else editorDays.push(d);b.classList.toggle('on');return}if(D.preset){preset(D.preset);return}if(D.theme){setTheme(D.theme);return}switch(D.a){case'new':openEditor(null,'task');return;case'newTask':openEditor(null,'task');return;case'newRoutine':openEditor(null,'routine');return;case'settings':settings();return;case'close':closeSheet();return;case'save':saveEditor();return;case'delete':deleteEditor();return;case'calendar':exportCalendar();return;case'notifOn':notifOn();return;case'notifTest':notifTest();return;case'notifCopy':notifCopy();return;case'import':try{var q=JSON.parse($('backup').value);if(!q||!Array.isArray(q.items))throw 0;snapshot('import');S=q;S.settings=S.settings||{theme:'auto'};S.lists=S.lists||{Inbox:'#8a8494'};save();applyTheme();closeSheet();toast('Imported · '+q.items.length+' items','Undo',undo)}catch(err){toast('That backup could not be read')}return;case'copy':if(navigator.clipboard)navigator.clipboard.writeText($('backup').value).then(function(){toast('Copied')}).catch(function(){toast('Could not copy')});return}}var ed=e.target.closest('[data-edit]');if(ed){openEditor(ed.dataset.edit);return}});
})();
