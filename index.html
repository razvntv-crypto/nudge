<style>

olid var(--line);background:var(--card);padding:0 15px}.danger{color:var(--bad)}.note{font-size:12.5px;color:var(--mute);line-height:1.45;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 11px;margin-top:10px}.note b{color:var(--ink)}.history{display:flex;gap:6px;flex-wrap:wrap}.history span{font-size:11px;background:var(--card2);border:1px solid var(--line);padding:5px 8px;border-radius:99px;color:var(--mute)}.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:14px;font-weight:700;z-index:99;max-width:90%;text-align:center;box-shadow:var(--shadow)}
@keyframes viewIn{0%{opacity:0;transform:translate3d(0,18px,0)}100%{opacity:1;transform:translate3d(0,0,0)}}

<body>
<div class="wrap" id="app"></div>

<script>
(function(){
'use strict';
var PAL=['#6b45ff','#e0457b','#1f9d6a','#e08a1e','#2f8fe0','#a24fd6','#17a3a3','#7d8a2e'];
var WDL=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var WDR={sun:0,sunday:0,duminica:0,duminică:0,mon:1,monday:1,luni:1,tue:2,tues:2,tuesday:2,marti:2,marți:2,wed:3,wednesday:3,miercuri:3,thu:4,thur:4,thurs:4,thursday:4,joi:4,fri:5,friday:5,vineri:5,sat:6,saturday:6,sambata:6,sâmbătă:6};
var S=loadState();
var view='today',selected=today(),listFilter=null,editId=null,editorKind='task',editorPriority=0,editorDays=[1,3,5];
function $(id){return document.getElementById(id)}
function pad(n){return('0'+n).slice(-2)}
function today(){return dateStr(new Date())}
function dateStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseDate(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function addDays(s,n){var d=parseDate(s);d.setDate(d.getDate()+n);return dateStr(d)}
function diffDays(a,b){return Math.round((parseDate(b)-parseDate(a))/864e5)}
function monthDiff(a,b){var x=parseDate(a),y=parseDate(b);return(y.getFullYear()-x.getFullYear())*12+(y.getMonth()-x.getMonth())}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function save(){localStorage.setItem('nudge_v2',JSON.stringify(S));updateBadge();queueReminderSync()}
function toast(t){var old=$('toast');if(old)old.remove();var d=document.createElement('div');d.className='toast';d.id='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){if(d.parentNode)d.remove()},2200)}
function updateBadge(){var c=itemsForDate(today(),true).filter(function(x){return !isDone(x,today())}).length;try{if(navigator.setAppBadge){c?navigator.setAppBadge(c):navigator.clearAppBadge()}}catch(e){}}

var syncTimer=null;
var VAPID_PUBLIC_KEY='BPQiYZIdVtVxhMOMWTerRS3SJAr3_5PSUw7cJ4qc_4WnMNOe4zkU1zfWBCnxx9dVpjJYVG03oHx2vWjRqQ3vJ74';
function ownerToken(){return localStorage.getItem('nudge_owner_token')||''}
function saveOwnerToken(){var el=$('ownerToken');if(el&&el.value.trim())localStorage.setItem('nudge_owner_token',el.value.trim());return ownerToken()}
function urlB64ToUint8Array(s){var p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(b),out=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}
async function registerPushWorker(){if(!('serviceWorker' in navigator))return null;try{return await navigator.serviceWorker.register('/service-worker.js')}catch(e){console.error(e);return null}}
function queueReminderSync(){clearTimeout(syncTimer);syncTimer=setTimeout(syncReminders,700)}
async function syncReminders(){var token=ownerToken();if(!token)return;try{var res=await fetch('/api/nudge-sync',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:token,items:S.items,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Bucharest'})});if(!res.ok)console.warn('Nudge reminder sync failed',res.status)}catch(e){console.warn('Nudge reminder sync failed',e)}}
async function enableNotifications(){var token=saveOwnerToken();if(!token){toast('Paste your Nudge key first');return}if(!('Notification' in window)||!('serviceWorker' in navigator)||!('PushManager' in window)){toast('Push is not supported here');return}try{var permission=await Notification.requestPermission();if(permission!=='granted'){toast('Notifications not allowed');return}var reg=await registerPushWorker();if(!reg){toast('Service worker failed');return}var sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8Array(VAPID_PUBLIC_KEY)});var res=await fetch('/api/nudge-subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:token,subscription:sub.toJSON()})});var data=await res.json().catch(function(){return{}});if(!res.ok)throw new Error(data.error||'Subscribe failed');await syncReminders();toast('Notifications enabled ✓');settings()}catch(e){console.error(e);toast(e.message||'Could not enable notifications')}}
async function testPush(){var token=saveOwnerToken();if(!token){toast('Paste your Nudge key first');return}try{var res=await fetch('/api/nudge-test-push',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:token})});var data=await res.json().catch(function(){return{}});if(!res.ok)throw new Error(data.error||'Test failed');toast('Test sent — lock the phone')}catch(e){console.error(e);toast(e.message||'Test failed')}}

function loadState(){var base={version:2,items:[],lists:{Inbox:'#8a8494'},settings:{theme:'auto'}};try{var v2=localStorage.getItem('nudge_v2');if(v2){var q=Object.assign(base,JSON.parse(v2));q.items=q.items||[];q.lists=q.lists||{Inbox:'#8a8494'};return q}var old=localStorage.getItem('nudge');if(old){var o=JSON.parse(old);base.lists=o.lists||base.lists;base.items=(o.tasks||[]).map(function(t){var kind=t.r?'routine':'task',repeat=null;if(t.r==='d')repeat={type:'daily',every:1};if(t.r==='w')repeat={type:'weekly',every:1};if(t.r==='m')repeat={type:'monthly',every:1};return{id:t.id||uid(),title:t.t||'Untitled',notes:t.n||'',date:t.d||'',time:t.tm||'',priority:t.p||0,list:t.l||'Inbox',kind:kind,repeat:repeat,start:t.d||today(),done:t.done||0,doneDates:[],created:t.c||Date.now()}});localStorage.setItem('nudge_v2',JSON.stringify(base));return base}}catch(e){}return base}
function listFor(name){name=(name||'').trim();if(!name)return'Inbox';var k=Object.keys(S.lists).find(function(x){return x.toLowerCase()===name.toLowerCase()});if(k)return k;name=name.charAt(0).toUpperCase()+name.slice(1);S.lists[name]=PAL[(Object.keys(S.lists).length-1)%PAL.length];return name}
function kindLabel(i){return i.kind==='routine'?'Routine':'Task'}
function dueOn(i,d){if(i.kind==='task')return i.date===d;var start=i.start||i.date||today();if(d<start)return false;var r=i.repeat||{type:'daily',every:1},every=Math.max(1,+r.every||1),delta=diffDays(start,d);if(delta<0)return false;if(r.type==='daily'||r.type==='intervalDays')return delta%every===0;if(r.type==='weekdays'){var wd=parseDate(d).getDay(),days=(r.days&&r.days.length?r.days:[parseDate(start).getDay()]);if(days.indexOf(wd)<0)return false;if(every===1)return true;return Math.floor(delta/7)%every===0}if(r.type==='weekly')return parseDate(d).getDay()===parseDate(start).getDay()&&Math.floor(delta/7)%every===0;if(r.type==='monthly'){var a=parseDate(start),b=parseDate(d);return a.getDate()===b.getDate()&&monthDiff(start,d)%every===0}return false}
function isDone(i,d){return i.kind==='routine'?(i.doneDates||[]).indexOf(d)>-1:!!i.done}
function itemTimeValue(i,d){var tm=i.time||'23:59';return new Date(d+'T'+tm+':00').getTime()}
function itemsForDate(d,includeOverdue){var arr=S.items.filter(function(i){if(listFilter&&i.list!==listFilter)return false;if(i.kind==='routine')return dueOn(i,d);return i.date===d});if(includeOverdue&&d===today())arr=arr.concat(S.items.filter(function(i){return i.kind==='task'&&!i.done&&i.date&&i.date<d&&(!listFilter||i.list===listFilter)}));return arr.sort(function(a,b){return itemTimeValue(a,a.date&&a.date<d?a.date:d)-itemTimeValue(b,b.date&&b.date<d?b.date:d)||b.priority-a.priority})}
function nextOccurrence(i,from,strict){if(i.kind==='task'){if(!i.done&&i.date&&(strict?i.date>from:i.date>=from))return i.date;return''}var s=strict?addDays(from,1):from;for(var n=0;n<740;n++){var d=addDays(s,n);if(dueOn(i,d))return d}return''}
function weekStart(d){var x=parseDate(d),wd=x.getDay();x.setDate(x.getDate()-((wd+6)%7));return dateStr(x)}
function dayLabel(d){var x=parseDate(d);if(d===today())return'Today';if(d===addDays(today(),1))return'Tomorrow';return x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function longDate(d){return parseDate(d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}
function timeText(i){return i.time||'Anytime'}

function exportCalendar(){var title=$('et').value.trim()||'Nudge',notes=$('en').value.trim(),date=$('ed').value,time=$('etm').value,isRoutine=editorKind==='routine';if(!date){toast('Pick a date first');return}var dt=date.replace(/-/g,''),start=time?dt+'T'+time.replace(':','')+'00':dt,s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Nudge//EN\r\nBEGIN:VEVENT\r\nUID:'+uid()+'@nudge\r\nDTSTAMP:'+new Date().toISOString().replace(/[-:]|\.\d+/g,'')+'\r\n';if(time){s+='DTSTART:'+start+'\r\n';var end=new Date(date+'T'+time+':00');end=new Date(end.getTime()+30*60000);s+='DTEND:'+dateStr(end).replace(/-/g,'')+'T'+pad(end.getHours())+pad(end.getMinutes())+'00\r\n'}else{s+='DTSTART;VALUE=DATE:'+dt+'\r\nDTEND;VALUE=DATE:'+addDays(date,1).replace(/-/g,'')+'\r\n'}s+='SUMMARY:'+icsEscape(title)+'\r\n';if(notes)s+='DESCRIPTION:'+icsEscape(notes)+'\r\n';if(isRoutine){var type=$('ert').value,e=$('every')?Math.max(1,+$('every').value||1):1,rule='';if(type==='daily'||type==='intervalDays')rule='FREQ=DAILY;INTERVAL='+e;if(type==='weekly')rule='FREQ=WEEKLY;INTERVAL='+e;if(type==='monthly')rule='FREQ=MONTHLY;INTERVAL='+e;if(type==='weekdays'){var map=['SU','MO','TU','WE','TH','FR','SA'];rule='FREQ=WEEKLY;INTERVAL='+e+';BYDAY='+editorDays.slice().sort().map(function(d){return map[d]}).join(',')}if(rule)s+='RRULE:'+rule+'\r\n'}s+='BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:'+icsEscape(title)+'\r\nTRIGGER:'+(time?'PT0S':'PT9H')+'\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n';var fl=new File([s],(title.replace(/\W+/g,'_')||'nudge')+'.ics',{type:'text/calendar'});try{if(navigator.canShare&&navigator.canShare({files:[fl]})){navigator.share({files:[fl]}).catch(function(){});return}}catch(e){}var a=document.createElement('a');a.href=URL.createObjectURL(fl);a.download=fl.name;document.body.appendChild(a);a.click();var u=a.href;a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
applyTheme();render();registerPushWorker();setTimeout(syncReminders,1200);
document.addEventListener('change',function(e){if(e.target.id==='ert')renderRepeatExtra({type:e.target.value,every:1,days:editorDays})});
document.addEventListener('click',function(e){var b=e.target.closest('button');if(b){var D=b.dataset;if(D.v){view=D.v;if(view==='today')selected=today();render();return}if(D.day){selected=D.day;view='today';render();return}if(D.check){toggleDone(D.check,D.date);return}if(D.kind){editorKind=D.kind;renderEditor(editId?S.items.find(function(x){return x.id===editId}):null);return}if(D.pr!==undefined){editorPriority=+D.pr;document.querySelectorAll('[data-pr]').forEach(function(x){x.classList.toggle('on',+x.dataset.pr===editorPriority)});return}if(D.wd!==undefined){var d=+D.wd,k=editorDays.indexOf(d);if(k>-1)editorDays.splice(k,1);else editorDays.push(d);b.classList.toggle('on');return}if(D.preset){preset(D.preset);return}if(D.theme){setTheme(D.theme);return}switch(D.a){case'new':openEditor(null,'task');return;case'newTask':openEditor(null,'task');return;case'newRoutine':openEditor(null,'routine');return;case'settings':settings();return;case'close':closeSheet();return;case'save':saveEditor();return;case'delete':deleteEditor();return;case'calendar':exportCalendar();return;case'notifyEnable':enableNotifications();return;case'testPush':testPush();return;case'import':try{var q=JSON.parse($('backup').value);if(!q||!Array.isArray(q.items))throw 0;S=q;S.settings=S.settings||{theme:'auto'};save();applyTheme();closeSheet();toast('Imported')}catch(err){toast('Invalid backup')}return;case'copy':if(navigator.clipboard)navigator.clipboard.writeText($('backup').value).then(function(){toast('Copied')}).catch(function(){toast('Could not copy')});return}}var ed=e.target.closest('[data-edit]');if(ed){openEditor(ed.dataset.edit);return}});
})();
</script>
